
[manifest]
version = "1.2"
dump_lua = true
priority = 100


[[patches]]
[patches.copy]
target = "main.lua"
position = "append"
sources = [
	"ap.lua"
]


[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = """  local t =   create_UIBox_generic_options({no_back = from_game_over, no_esc = from_game_over, contents ={"""
position = "at"
payload = '''  local t =   create_UIBox_generic_options({back_func = from_game_over and 'escapism_back', contents ={'''
match_indent = true
